<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>шбұрышҮ</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #e6fff0;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      background: white;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
      max-width: 400px;
      width: 90%;
    }

    h1 {
      color: #2e8b57;
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    .buy-button {
      background-color: #2e8b57;
      color: white;
      padding: 0.7rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 2rem;
      transition: background 0.3s;
    }

    .buy-button:hover {
      background-color: #246b45;
    }

    input[type="text"] {
      padding: 0.6rem;
      font-size: 1rem;
      width: 100%;
      margin-bottom: 1rem;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    .login-button {
      background-color: #2e8b57;
      color: white;
      padding: 0.7rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
    }

    .error {
      color: #e53935;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Бағдарламаны қолдану үшін админнен кодты сатып алыңыз</h1>
    <a class="buy-button" href="https://wa.me/+77016661519?text=%D0%A1%D3%99%D0%BB%D0%B5%D0%BC%2C%20%D2%AE%D1%88%D0%B1%D2%B1%D1%80%D1%8B%D1%88%20%D0%B1%D0%B0%D2%93%D0%B4%D0%B0%D1%80%D0%BB%D0%B0%D0%BC%D0%B0%D1%81%D1%8B%D0%BD%20%D1%81%D0%B0%D1%82%D1%8B%D0%BF%20%D0%B0%D0%BB%D2%93%D1%8B%D0%BC%20%D0%BA%D0%B5%D0%BB%D0%B5%D0%B4%D1%96!">
      Сатып алу
    </a>
    <input type="text" id="accessCode" placeholder="Кодты енгізіңіз">
    <button class="login-button" onclick="checkCode()">Кіру</button>
    <div id="error" class="error" style="display: none;">Код дұрыс емес</div>
  </div>

  <script>
    function checkCode() {
      const input = document.getElementById("accessCode").value.trim();
      const validCode = "ushburish_2025_000";
      const errorDiv = document.getElementById("error");

      if (input === validCode) {
        window.location.href = "app.html";
      } else {
        errorDiv.style.display = "block";
      }
    }
  </script>
</body>
</html>
