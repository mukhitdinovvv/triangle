<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>123</title>
  <style>
    /* Сброс отступов и базовая стилизация */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #111;
      padding: 1rem;
      line-height: 1.6;
    }

    header {
      text-align: center;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.8rem;
    }

    .iframe-container {
      position: relative;
      width: 100%;
      padding-bottom: 140%; /* Соотношение сторон */
      height: 0;
      overflow: hidden;
    }

    .iframe-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    @media (min-width: 768px) {
      .iframe-container {
        padding-bottom: 80%; /* Менее вытянуто на ПК */
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Үшбұрыш формулалар жинағы</h1>
  </header>

  <div class="iframe-container">
    <iframe src="https://docs.google.com/document/d/e/2PACX-1vReCchOJvA_-e_6_NRZ_u-7LdgYHuK7jCxS-QkL1sYzAE__mVQpJMXVebhZe5GoyA/pub?embedded=true"></iframe>
  </div>

</body>
</html>
